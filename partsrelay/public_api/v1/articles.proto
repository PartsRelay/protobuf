syntax = "proto3";

package partsrelay.public_api.v1;

// The articles of the seller, read from its management system at every call.
//
// Every call sends the API key of the company in the metadata
// "authorization: Bearer <key>", a test_ or a live_ key, at most 300 calls a
// minute for each key.
//
// A failed call carries its reason in the trailer "code", in kebab case:
// UNAUTHENTICATED "invalid-api-key", RESOURCE_EXHAUSTED "too-many-requests"
// with the seconds to wait in the trailer "retry-after", INVALID_ARGUMENT
// "validation-error" with the first 20 refused fields in the trailer "fields",
// by JSON path and rule, like [{"field":"items.0.quantity","rule":"min"}],
// UNAVAILABLE or DEADLINE_EXCEEDED the code of the seller's management system,
// like "seller-timeout", and INTERNAL "internal-server-error".
service ArticleService {
  // A page of the articles, or only the ones of some codes.
  rpc ListArticles(ListArticlesRequest) returns (ListArticlesResponse);
}

message ListArticlesRequest {
  // 1 by default.
  optional int32 page = 1;
  // 1 to 100, 20 by default.
  optional int32 per_page = 2;
  // Only the articles of these codes, the first 100.
  repeated string codes = 3;
}

message ListArticlesResponse {
  repeated Article articles = 1;
  // The articles of every page.
  int32 total = 2;
}

message Article {
  string brand = 1;
  string code = 2;
  optional string description = 3;
  // The quantity available.
  int32 quantity = 4;
  // A decimal, like "48.90".
  optional string price = 5;
  // ISO 4217, like "EUR".
  optional string currency = 6;
}
