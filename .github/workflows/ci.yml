name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, ready_for_review, synchronize, labeled, unlabeled]
  push:
    branches: [main]

# Every merge into main keeps its own run
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write

jobs:
  buf:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bufbuild/buf-action@v1
        with:
          version: 1.75.0
          # On main too, without publishing to the Buf registry
          lint: true
          format: true
          push: false
          pr_comment: ${{ github.event_name == 'pull_request' }}
